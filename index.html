<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        loading-screen="enabled: false;"
        renderer="logarithmicDepthBuffer: true;"
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
        embedded
    >
        <a-assets>
            <a-asset-item id="zeiss-asset" src="assets/zeiss-eye.gltf"></a-asset-item>
            <a-asset-item id="mera-asset" src="assets/mera-heart.gltf"></a-asset-item>
        </a-assets>

        <!-- 顕微鏡 -->
        <a-marker
            id="marker-zeiss"
            type="pattern"
            preset="custom"
            url="assets/pattern-marker-zeiss.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                gltf-model="#zeiss-asset"
                scale="1 1 1"
                class="clickable"
            ></a-entity>
        </a-marker>

        <!-- 人工心肺 -->
        <a-marker
            id="marker-mera"
            type="pattern"
            preset="custom"
            url="assets/pattern-marker-mera.patt"
            raycaster="objects: .clickable"
            emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;"
        >
            <a-entity
                gltf-model="#mera-asset"
                scale="1 1 1"
                animation-mixer="loop: repeat"
                class="clickable"
            ></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
