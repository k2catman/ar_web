<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* 
          手動配置したビデオ要素を画面いっぱいに広げ、最背面に固定配置。
          これにより、AR.jsの自動生成バグによる黒画面を物理的に防ぎます。
        */
        #arjs-webcam-video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 
      【重要】ブラウザの自動再生ブロックを完全に回避するための設定を網羅したビデオタグ。
      AR.jsに自動生成させず、これを使って強制描画させます。
    -->
    <video id="arjs-webcam-video" autoplay playsinline webkit-playsinline muted loop></video>

    <!-- 
      sourceType: image に指定して、AR.js側の不完全な自動Webcam生成を「意図的に停止」させます。
      カメラパラメータはBase64形式で内蔵。
    -->
    <a-scene 
        embedded 
        arjs="sourceType: image; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        // ページ読み込み時に、ブラウザ標準の安全な手順でカメラを起動してビデオタグに流し込む
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('arjs-webcam-video');

            const constraints = {
                video: {
                    facingMode: 'environment', // 背面カメラを優先
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                
                // 映像が実際に再生開始されたら、AR.jsの追跡対象にこのビデオ要素を強制設定する
                video.onloadedmetadata = () => {
                    video.play();
                    
                    const sceneEl = document.querySelector('a-scene');
                    if (sceneEl) {
                        sceneEl.addEventListener('loaded', () => {
                            const arSystem = sceneEl.systems.arjs;
                            if (arSystem && arSystem.arToolkitSource) {
                                // AR.jsの内部エンジンに手動生成のビデオ要素を直接バインド
                                arSystem.arToolkitSource.domElement = video;
                                arSystem.arToolkitSource.init(() => {
                                    window.dispatchEvent(new Event('resize'));
                                });
                            }
                        });
                        
                        // すでにシーンがロード済みのケースの対策
                        if (sceneEl.hasLoaded) {
                            const arSystem = sceneEl.systems.arjs;
                            if (arSystem && arSystem.arToolkitSource) {
                                arSystem.arToolkitSource.domElement = video;
                                arSystem.arToolkitSource.init(() => {
                                    window.dispatchEvent(new Event('resize'));
                                });
                            }
                        }
                    }
                    
                    // 画面のサイズ崩れを防ぐためのリサイズ命令
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 500);
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 1500);
                };
            })
            .catch((err) => {
                console.error("Camera access error:", err);
            });
        });
    </script>

</body>
</html>
