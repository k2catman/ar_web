<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Mera & Zeiss</title>
    <!-- A-Frame ライブラリの読み込み -->
    <script src="https://aframe.io"></script>
    <!-- AR.js for A-Frame ライブラリの読み込み -->
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ARシーンの定義（デバッグ表示は無効、カメラの解像度等を最適化） -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

        <!-- 資産（Assets）の事前読み込み定義 -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            <!-- 3Dモデルの配置（サイズや角度は必要に応じて調整してください） -->
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            <!-- 3Dモデルの配置（サイズや角度は必要に応じて調整してください） -->
            
            
        </a-marker>

        <!-- AR用のカメラ配置 -->
        

    </a-scene>

</body>
</html>
