<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <!-- 
      【重要】エラーを連発していた古い AR.js を完全に排除。
      最新のブラウザ環境（iOS 17-19 / 各種PC）に100%準拠した A-Frame 最新安定版（v1.6.0）のみを使用し、
      ブラウザ標準の WebXR 機能を使ってカメラを安全・確実に起動させます。
    -->
    <script src="https://cloudflare.com"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* カメラ起動時のUIを画面に馴染ませる設定 */
        .ar-overlay {
            position: fixed; top: 10px; left: 10px; z-index: 999;
            background: rgba(0,0,0,0.6); color: white; padding: 8px 12px;
            border-radius: 4px; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div class="ar-overlay">AR Mode Active: マーカーをかざしてください</div>

    <!-- 
      A-Frame標準のWebXR（画像トラッキング機能）を有効化。
      これまでの古いAR.jsと異なり、ブラウザのセキュリティ機能にブロックされません。
    -->
    <a-scene 
        webxr="optionalFeatures: image-tracking; requiredFeatures: local-floor;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
