<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <!-- 安定動作実績のあるライブラリ構成 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        /* 画面全体の余白を完全にゼロにする */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #000000;
        }
        
        /* 
          【全画面固定CSS】
          JS側のプロパティロックと組み合わせて、カメラ映像（video）と
          3Dキャンバス（.a-canvas）を完全に画面全体に固定します。
        */
        #arjs-webcam-video, 
        video, 
        .a-canvas, 
        a-scene {
            position: fixed !important;
            top: 0px !important;
            left: 0px !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        video {
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ブラウザの自動再生ブロックを回避する生ビデオ要素 -->
    <video id="arjs-webcam-video" autoplay playsinline webkit-playsinline muted loop></video>

    <!-- 
      - sourceType: image に指定して、AR.js側の不完全な自動カメラ生成を停止
      - cameraParametersUrl: 外部通信のタイムアウトを防ぐためBase64データを内蔵
    -->
    <a-scene 
        embedded 
        arjs="sourceType: image; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        // 【超強力・書き換え禁止ハック】
        // AR.jsが後からvideo要素の「style」プロパティを勝手に書き換えて下部にズラすのを完全に禁止（フリーズ）します。
        const videoElement = document.getElementById('arjs-webcam-video');
        Object.defineProperty(videoElement, 'style', {
            writable: false,
            configurable: false,
            value: videoElement.style
        });

        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('arjs-webcam-video');

            const constraints = {
                video: {
                    facingMode: 'environment', // スマホの背面カメラ
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    
                    const sceneEl = document.querySelector('a-scene');
                    
                    // キャンバス側の書き換え暴走も完全にロックする関数
                    const lockCanvasStyle = () => {
                        const canvas = sceneEl.querySelector('.a-canvas');
                        if (canvas && !canvas.dataset.locked) {
                            canvas.style.setProperty('width', '100vw', 'important');
                            canvas.style.setProperty('height', '100vh', 'important');
                            canvas.style.setProperty('top', '0px', 'important');
                            canvas.style.setProperty('left', '0px', 'important');
                            canvas.style.setProperty('position', 'fixed', 'important');
                            
                            // キャンバスのstyleプロパティも上書き禁止にする
                            Object.defineProperty(canvas, 'style', {
                                writable: false,
                                configurable: false,
                                value: canvas.style
                            });
                            canvas.dataset.locked = "true";
                        }
                    };

                    const initToolkit = () => {
                        const arSystem = sceneEl.systems.arjs;
                        if (arSystem && arSystem.arToolkitSource) {
                            arSystem.arToolkitSource.domElement = video;
                            arSystem.arToolkitSource.init(() => {
                                lockCanvasStyle();
                                window.dispatchEvent(new Event('resize'));
                            });
                        }
                    };

                    if (sceneEl.hasLoaded) {
                        initToolkit();
                        lockCanvasStyle();
                    } else {
                        sceneEl.addEventListener('loaded', () => {
                            initToolkit();
                            lockCanvasStyle();
                        });
                    }
                };
            })
            .catch((err) => {
                console.error("Camera access error:", err);
            });
        });
    </script>

</body>
</html>
