<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Marker AR Demo (glb)</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js (marker-based, A-Frame build) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      vr-mode-ui="enabled: true"
      renderer="logarithmicDepthBuffer: true; antialias: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- glb assets -->
      <a-assets>
        <a-asset-item
          id="mera-heart-model"
          src="./assets/mera-heart.glb"
        ></a-asset-item>
        <a-asset-item
          id="zeiss-eye-model"
          src="./assets/zeiss-eye.glb"
        ></a-asset-item>
        <!-- 追加: C-Arm モデル -->
        <a-asset-item
          id="c-arm-model"
          src="./assets/c-arm.glb"
        ></a-asset-item>
      </a-assets>

      <!-- Mera heart marker -->
      <a-marker
        type="pattern"
        url="./assets/pattern-marker-mera.patt"
        emitevents="true"
      >
        
      </a-marker>

      <!-- Zeiss eye marker -->
      <a-marker
        type="pattern"
        url="./assets/pattern-marker-zeiss.patt"
        emitevents="true"
      >
        
      </a-marker>

      <!-- 追加: C-Arm マーカー -->
      <a-marker
        type="pattern"
        url="./assets/pattern-marker-c_arm.patt"
        emitevents="true"
      >
        
      </a-marker>

      <!-- Camera -->
      
    </a-scene>
  </body>
</html>
