<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Absolute Offline Stable</title>

      A-Frame本体のみ、最も遮断されにくい大手Googleのサーバーから安全に読み込みます。
      万が一、ここもブロックされる場合はお知らせください。
    -->
    <script src="https://googleapis.com"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* カメラ映像（video要素）のレイヤー優先度を最背面に強制固定 */
        video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100vw !important; height: 100vh !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 
      外部への干渉を受けず、1つのシーンで2つのマーカー（Mera, Zeiss）を制御
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

</body>
</html>
