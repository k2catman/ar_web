<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <!-- 安定動作実績のあるライブラリ構成 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        /* 画面全体の余白を完全にリセット */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: #000000;
        }
        
        /* 
          【位置ズレバグ完全撃破CSS】
          AR.jsが裏で勝手にvideoタグへ書き込む「margin-top」や「width/height」のズレ計算を、
          CSSの「最上位セレクタ指定」と「!important」の組み合わせで強制的に無効化します。
          これで映像が下へ押し下げられるのを完全に防ぎ、画面全体に引き伸ばします。
        */
        body video, 
        html body video, 
        .a-container video, 
        #arjs-webcam-video {
            top: 0px !important;
            left: 0px !important;
            margin-top: 0px !important;
            margin-left: 0px !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            z-index: -2 !important;
        }

        /* 3Dを描画するキャンバス層も画面全体に完全同期 */
        .a-canvas {
            top: 0px !important;
            left: 0px !important;
            margin: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            position: fixed !important;
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ブラウザの自動再生ブロックを回避する生ビデオ要素 -->
    <video id="arjs-webcam-video" autoplay playsinline webkit-playsinline muted loop></video>

    <!-- 
      - sourceType: image に指定して、AR.js側の不完全なサイズ計算（位置ズレの元凶）を停止
      - cameraParametersUrl: 外部通信のタイムアウトを防ぐためBase64データを内蔵
    -->
    <a-scene 
        embedded 
        arjs="sourceType: image; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('arjs-webcam-video');

            const constraints = {
                video: {
                    facingMode: 'environment', // 背面カメラ
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    
                    const sceneEl = document.querySelector('a-scene');
                    
                    const initToolkit = () => {
                        const arSystem = sceneEl.systems.arjs;
                        if (arSystem && arSystem.arToolkitSource) {
                            arSystem.arToolkitSource.domElement = video;
                            arSystem.arToolkitSource.init(() => {
                                // 起動直後にリサイズを1回だけ呼び、AR.js側に現在の全画面サイズを認識させる
                                window.dispatchEvent(new Event('resize'));
                            });
                        }
                    };

                    if (sceneEl.hasLoaded) {
                        initToolkit();
                    } else {
                        sceneEl.addEventListener('loaded', initToolkit);
                    }
                };
            })
            .catch((err) => {
                console.error("Camera access error:", err);
            });
        });
    </script>

</body>
</html>
