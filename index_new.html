<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <!-- 安定動作する最新のA-Frame 1.6.0を採用 -->
    <script src="https://cloudflare.com"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* 
          ブラウザの自動起動制限を解除するための物理ボタン画面。
          これをタップさせることで、真っ黒な画面を強制解除してカメラを起動させます。
        */
        #ar-start-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(20, 20, 20, 0.9); z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #ar-button {
            padding: 20px 40px; font-size: 20px; font-weight: bold;
            background-color: #007AFF; color: white; border: none; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.4);
            transition: background-color 0.2s;
        }
        #ar-button:active { background-color: #0051A8; }
        .info-text { margin-top: 15px; color: #ccc; font-size: 14px; text-align: center; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 起動用ボタンの画面 -->
    <div id="ar-start-overlay">
        <button id="ar-button" onclick="activateAR()">ARカメラを起動する</button>
        <div class="info-text">ボタンを押してカメラを許可してください</div>
    </div>

    <!-- 
      webxrコンポーネント: 
      - referenceSpaceType: local (スマホ・PCのカメラ位置を基準に設定)
    -->
    <a-scene 
        webxr="optionalFeatures: image-tracking; requiredFeatures: local; referenceSpaceType: local;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のマーカー設定（ pattern-marker-mera.png などの画像を指定してください ） -->
        
            
        

        <!-- 2. Zeiss用のマーカー設定 （ pattern-marker-zeiss.png などの画像を指定してください ） -->
        
            
        

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        function activateAR() {
            const sceneEl = document.querySelector('a-scene');
            
            // ユーザーのタップを検知して、A-Frameの内蔵WebXR（ARモード）を強制スタート
            if (sceneEl) {
                sceneEl.enterVR(); // WebXR規格のARモードを起動
                
                // ボタン画面を消してカメラ映像を最前面に出す
                document.getElementById('ar-start-overlay').style.display = 'none';
            }
        }
    </script>

</body>
</html>
