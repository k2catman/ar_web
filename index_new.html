<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Final</title>
    
    <!-- 読み込みに成功している安定版のライブラリ構成 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        /* 画面全体の余白をゼロにし、ズレによるスクロールを完全に禁止 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* 
          【無限リサイズループ対策CSS】
          AR.jsのバグによるサイズ迷子を防ぐため、カメラ映像（video）と
          A-Frameの描画領域（a-canvas）の大きさを「画面全体」に物理的に完全固定します。
        */
        video, .a-canvas, a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            box-sizing: border-box !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        video {
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ブラウザの自動再生ブロックを回避するビデオタグ（あらかじめHTMLに配置） -->
    <video id="arjs-webcam-video" autoplay playsinline webkit-playsinline muted loop></video>

    <!-- 
      ARシーン設定:
      - sourceType: image に指定して、AR.js側の不完全な自動Webcam生成（リサイズバグの主犯）を停止
      - 無限ループの原因になる内蔵リサイズ処理を妨害するため、明示的にサイズを指定
    -->
    <a-scene 
        embedded 
        arjs="sourceType: image; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            <!-- 浮かび上がる3Dモデル。万が一ズレていても見つけやすいよう少し大きめ（scale="1"）に設定 -->
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('arjs-webcam-video');

            // スマホやPCの画面解像度に合わせて最適なカメラ出力を要求
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: window.innerWidth > window.innerHeight ? window.innerWidth : window.innerHeight },
                    height: { ideal: window.innerWidth > window.innerHeight ? window.innerHeight : window.innerWidth }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    
                    const sceneEl = document.querySelector('a-scene');
                    
                    // AR.jsが画面を壊すリサイズ処理を上書きして乗っ取る関数
                    const forceLockLayout = () => {
                        const canvas = sceneEl.querySelector('.a-canvas');
                        if (canvas) {
                            canvas.style.setProperty('width', '100vw', 'important');
                            canvas.style.setProperty('height', '100vh', 'important');
                        }
                        video.style.setProperty('width', '100vw', 'important');
                        video.style.setProperty('height', '100vh', 'important');
                    };

                    const initToolkit = () => {
                        const arSystem = sceneEl.systems.arjs;
                        if (arSystem && arSystem.arToolkitSource) {
                            // AR.jsの内部エンジンに、正しく起動したビデオ要素を強制連結
                            arSystem.arToolkitSource.domElement = video;
                            arSystem.arToolkitSource.init(() => {
                                forceLockLayout();
                                window.dispatchEvent(new Event('resize'));
                            });
                        }
                    };

                    if (sceneEl.hasLoaded) {
                        initToolkit();
                    } else {
                        sceneEl.addEventListener('loaded', initToolkit);
                    }

                    // AR.jsがバグで勝手にサイズを変えるのを監視し、全画面に引き戻し続ける
                    window.addEventListener('resize', forceLockLayout);
                    setInterval(forceLockLayout, 500); 
                };
            })
            .catch((err) => {
                console.error("Camera access error:", err);
            });
        });
    </script>

</body>
</html>
