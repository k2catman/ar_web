<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR (Fixed)</title>
    
    <!-- 信頼性の高い大手公式CDNのみを使用し、ブラウザのブロックを回避 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        canvas {
            position: absolute; top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            z-index: 1;
        }
        video {
            position: absolute; top: 0; left: 0;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
            z-index: 0;
        }
    </style>
</head>
<body>

    <script>
        // 1. Three.js レンダラー・シーン・カメラの初期化
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setClearColor(new THREE.Color('lightgrey'), 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0px';
        renderer.domElement.style.left = '0px';
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.Camera();
        scene.add(camera);

        // 2. AR.js カメラ（Webcam）ソースの初期化
        const arToolkitSource = new THREEx.ArToolkitSource({ 
            sourceType: 'webcam',
            sourceWidth: 1280,
            sourceHeight: 720,
            displayWidth: window.innerWidth,
            displayHeight: window.innerHeight
        });
        
        arToolkitSource.init(function onReady() {
            setTimeout(function() {
                onResize();
            }, 500);
        });

        window.addEventListener('resize', function() { onResize(); });
        function onResize() {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if (arToolkitContext.arController !== null) {
                arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
            }
        }

        // 3. 【最重要】外部通信エラーを防ぐため、カメラパラメータをBase64データとして直接内蔵
        const cameraParaData = 'data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';

        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: cameraParaData,
            detectionMode: 'mono'
        });

        arToolkitContext.init(function onCompleted() {
            camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
        });

        // 4. マーカーごとのルートグループ設定
        const markerRootMera = new THREE.Group();
        scene.add(markerRootMera);
        new THREEx.ArMarkerControls(arToolkitContext, markerRootMera, {
            type: 'pattern',
            patternUrl: './assets/pattern-marker-mera.patt'
        });

        const markerRootZeiss = new THREE.Group();
        scene.add(markerRootZeiss);
        new THREEx.ArMarkerControls(arToolkitContext, markerRootZeiss, {
            type: 'pattern',
            patternUrl: './assets/pattern-marker-zeiss.patt'
        });

        // 5. ライティング（3Dモデル視認用）
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(0, 1, 0);
        scene.add(directionalLight);

        // 6. GLTFモデルのロード（位置・サイズをAR用に調整）
        const loader = new THREE.GLTFLoader();

        // Meraモデル
        loader.load('./assets/mera-heart.gltf', function(gltf) {
            const model = gltf.scene;
            model.scale.set(1.0, 1.0, 1.0);
            model.position.set(0, 0, 0);
            markerRootMera.add(model);
        });

        // Zeissモデル
        loader.load('./assets/zeiss-eye.gltf', function(gltf) {
            const model = gltf.scene;
            model.scale.set(1.0, 1.0, 1.0);
            model.position.set(0, 0, 0);
            markerRootZeiss.add(model);
        });

        // 7. 毎フレームの描画ループ
        function animate() {
            requestAnimationFrame(animate);
            if (arToolkitSource.ready === false) return;
            arToolkitContext.update(arToolkitSource.domElement);
            renderer.render(scene, camera);
        }
        animate();
    </script>

</body>
</html>
