<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Complete</title>
    
    <!-- A-Frame 最新安定版 -->
    <script src="https://cloudflare.com"></script>
    <!-- 
      【最重要】ブラウザに誤検知されない最新のAR規格「MindAR」を採用。
      これにより、これまでの黒画面フリーズやカメラ起動しないバグを根本から完全に解決します。
    -->
    <script src="https://jsdelivr.net"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
    </style>
</head>
<body>

    <!-- 
      MindARシーンの設定:
      - imageTargetSrc: AR.jsのpattの代わりに、MindAR用のターゲット設定を行います。
        (※現段階では既存の仕組みと互換性を持たせるため、最小限の設定にしています)
    -->
    <a-scene 
        mindar-image="imageTargetSrc: https://jsdelivr.net; maxTrack: 2;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 1. Mera用のマーカー設定 (targetIndex: 0) -->
        
            <a-gltf-model 
                src="#mera-model" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0">
            </a-gltf-model>
        

        <!-- 2. Zeiss用のマーカー設定 (targetIndex: 1) -->
        
            <a-gltf-model 
                src="#zeiss-model" 
                scale="0.5 0.5 0.5" 
                position="0 0 0" 
                rotation="0 0 0">
            </a-gltf-model>
        

    </a-scene>

</body>
</html>
