<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR</title>
    
    <!-- 互換性が最も高く、フリーズを起こしにくい固定バージョンの組み合わせ -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        /* 画面の余白を完全に削り、カメラと3Dの描画エリアを保証するCSS */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* AR.jsが自動生成するビデオ要素が背後に隠れて真っ白になるのを防ぐ強制スタイル */
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>

    <!-- 
      ARシーン設定:
      - sourceType: webcam (手動注入ではなく、AR.js本来の自動起動に任せる)
      - videoTexture: true (iOS Safariでの画面フリーズ・真っ白を完全に防止)
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            <!-- 3Dモデルの配置（初期値。もし表示が小さければ scale の値を大きくしてください） -->
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            <!-- 3Dモデルの配置 -->
            
            
        </a-marker>

        <!-- AR用のカメラ配置 -->
        

    </a-scene>

</body>
</html>
