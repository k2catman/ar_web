      ARシーンの設定:
      - videoTexture: true（iOSでの真っ白フリーズを防ぐ必須設定）
      - deviceOrientationEnabled: false（不要なセンサーエラーの防止）

    <a-scene

        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; deviceOrientationEnabled: false;"

      ARシーンの設定:
