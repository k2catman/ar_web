<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Fixed</title>
    
    <!-- 読み込みに成功している安定版のライブラリ構成 -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* 
          AR.jsが自動生成、または手動で上書きするビデオ要素を
          最背面の z-index: -2 に強制配置し、100%の画面サイズで表示させます。
        */
        video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- 
      外部通信バグを防ぐため、カメラパラメータデータは「Base64（Data URI形式）」を内蔵しています。
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        // 描画フリーズ（黒画面）を解決するための強制介入スクリプト
        window.addEventListener('camera-init', (data) => {
            console.log('camera-init', data);
        });

        window.addEventListener('arjs-video-loaded', (data) => {
            console.log('arjs-video-loaded', data);
            // ビデオ要素が生成された瞬間にリサイズを走らせて描画を強制キックします
            setTimeout(function() {
                window.dispatchEvent(new Event('resize'));
            }, 300);
        });

        // シーン初期化完了時にもリサイズイベントを連打してレイアウトを確定させます
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl) {
            sceneEl.addEventListener('loaded', function () {
                setTimeout(function() {
                    window.dispatchEvent(new Event('resize'));
                }, 500);
                setTimeout(function() {
                    window.dispatchEvent(new Event('resize'));
                }, 1500);
            });
        }
    </script>

</body>
</html>
