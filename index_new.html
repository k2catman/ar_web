<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR</title>
    
    <!-- トラブルが最も少ない超安定バージョンの組み合わせ -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    
    <style>
        /* 画面全体の余白をゼロにし、背景を真っ黒に指定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        
        /* 
          【超重要】カメラ映像（video要素）が真っ黒になるのを防ぐ強制CSS。
          AR.jsが生成する映像ソースを画面いっぱいに無理やり引き伸ばし、最背面に配置します。
        */
        video, .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>

    <!-- 
      ARシーン設定:
      - sourceType: webcam
      - videoTexture: true
      - sourceWidth / sourceHeight / displayWidth / displayHeight をすべて「1280x720」に完全統一。
        スマホ側の高解像度バグによる黒画面（0x0フリーズ）をこれで強制的に回避します。
    -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            <!-- 3Dモデルの配置（初期値を少し大きめの 1.5 に設定） -->
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            <!-- 3Dモデルの配置（初期値を少し大きめの 1.5 に設定） -->
            
            
        </a-marker>

        <!-- AR用のカメラ配置 -->
        

    </a-scene>

</body>
</html>
