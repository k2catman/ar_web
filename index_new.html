<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web AR - Multi Marker Fixed</title>
    
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        /* 画面全体の余白をゼロにし、ズレによるスクロールを完全に禁止 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000000;
        }
        /* 
          【映像ズレ完全修正CSS】
          iPhoneやPCの画面サイズに関わらず、カメラ映像（video）と、
          3Dを描画する画面（a-canvas）を、完全に画面中央（0,0）から100%のサイズで強制同期させます。
        */
        video, .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            box-sizing: border-box !important;
        }
        video {
            z-index: -2 !important;
        }
        .a-canvas {
            z-index: -1 !important;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ブラウザの自動再生ブロックを回避するビデオタグ -->
    <video id="arjs-webcam-video" autoplay playsinline webkit-playsinline muted loop></video>

    <!-- 
      ARシーン設定:
      sourceType: image に指定して、AR.js側の不完全な自動Webcam生成（サイズズレの元凶）を停止させます。
    -->
    <a-scene 
        embedded 
        arjs="sourceType: image; debugUIEnabled: false; videoTexture: true; cameraParametersUrl: data:text/plain;base64,QVJDbgABAAAA8D8AAAAAAMU/AAAAAAAAwD8AAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgD8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;"
        vr-mode-ui="enabled: false">

        <!-- 3Dモデル（Assets）の事前読み込み -->
        <a-assets>
            <a-asset-item id="mera-model" src="./assets/mera-heart.gltf"></a-asset-item>
            <a-asset-item id="zeiss-model" src="./assets/zeiss-eye.gltf"></a-asset-item>
        </a-assets>

        <!-- 1. Mera用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-mera.patt">
            <!-- 浮かび上がる3Dモデル（サイズが小さくて見失わないよう、初期設定を少し大きめの「1」に固定） -->
            
            
        </a-marker>

        <!-- 2. Zeiss用のカスタムマーカー設定 -->
        <a-marker type="pattern" url="./assets/pattern-marker-zeiss.patt">
            
            
        </a-marker>

        <!-- AR空間用カメラ -->
        

    </a-scene>

    <script>
        // カメラ映像をキャッチして、サイズを強制補正しながらAR.jsにバインドする処理
        window.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('arjs-webcam-video');

            const constraints = {
                video: {
                    facingMode: 'environment', // スマホは背面カメラ
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then((stream) => {
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    
                    const sceneEl = document.querySelector('a-scene');
                    if (sceneEl) {
                        const initToolkit = () => {
                            const arSystem = sceneEl.systems.arjs;
                            if (arSystem && arSystem.arToolkitSource) {
                                arSystem.arToolkitSource.domElement = video;
                                arSystem.arToolkitSource.init(() => {
                                    // 映像がズレるバグを殺すため、リサイズイベントを即時実行
                                    window.dispatchEvent(new Event('resize'));
                                });
                            }
                        };

                        if (sceneEl.hasLoaded) {
                            initToolkit();
                        } else {
                            sceneEl.addEventListener('loaded', initToolkit);
                        }
                    }
                    
                    // 読み込み完了後に時間差でリサイズを連打し、強制的に全画面フィットさせます
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 300);
                    setTimeout(() => { window.dispatchEvent(new Event('resize')); }, 1000);
                };
            })
            .catch((err) => {
                console.error("Camera access error:", err);
            });
        });
    </script>

</body>
</html>
